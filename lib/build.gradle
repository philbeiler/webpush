plugins {
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java-library'
	id 'checkstyle'
}

repositories {
    mavenCentral()
}

dependencies {

    api(platform("tools.jackson:jackson-bom:3.0.4"))
    api 'nl.martijndwars:web-push:5.1.2'
    api 'org.bouncycastle:bcprov-jdk18on:1.80'
    api("tools.jackson.core:jackson-databind")

    implementation(platform("org.springframework.boot:spring-boot-dependencies:4.0.2"))
    implementation 'javax.servlet:servlet-api:2.5'
    implementation 'org.slf4j:slf4j-api'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.apache.httpcomponents:httpcore:4.4.15'

    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'

    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.slf4j:slf4j-simple'
    testRuntimeOnly 'org.bouncycastle:bcprov-jdk18on:1.80'

    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyle.toolVersion}"
}


checkstyle {
    toolVersion '10.25.0'
    configFile rootProject.file("config/checkstyle/checkstyle.xml")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
}